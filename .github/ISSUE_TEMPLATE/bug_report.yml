name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not post Telegram credentials, auth tokens, login codes, session files, private messages, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android version, device, app commit/version, and relevant build type.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact all tokens, phone numbers, session data and private content before posting.
      render: shell
