name: Feature request
description: Suggest a focused client feature or improvement
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior, not just an implementation detail.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rust core
        - Telegram protocol/backend
        - Android / Compose UI
        - Media
        - Notifications / background
        - Build / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
