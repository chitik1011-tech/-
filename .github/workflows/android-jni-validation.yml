name: Android JNI validation

on:
  push:
    branches:
      - agent/android-jni
      - agent/integrate-telegram
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-jni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 37 and NDK
        shell: bash
        run: |
          android sdk install platforms/android-37 build-tools/36.0.0 ndk/28.2.13676358
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Prepare Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
