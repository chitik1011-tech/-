name: Android JNI validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 37 and NDK
        shell: bash
        run: |
          # Google SDK mirrors occasionally close large NDK downloads mid-transfer.
          # Retry transient transport failures while retaining a hard failure after 3 attempts.
          for attempt in 1 2 3; do
            if android sdk install platforms/android-37 build-tools/36.0.0 ndk/28.2.13676358; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK/NDK installation failed after 3 attempts"
              exit 1
            fi
            echo "::warning::Android SDK/NDK download failed on attempt $attempt; retrying"
            sleep "$((attempt * 10))"
          done
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify ARM64 JNI library is packaged
        working-directory: android
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/libtg_android_bridge.so"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
