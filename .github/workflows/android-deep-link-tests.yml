name: Android deep-link tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-deep-link-tests.yml"
      - "android/app/build.gradle.kts"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/java/com/chitik/telegram/MainActivity.kt"
      - "android/app/src/main/java/com/chitik/telegram/deeplink/**"
      - "android/app/src/test/java/com/chitik/telegram/deeplink/**"
  push:
    branches:
      - agent/android-deep-links

permissions:
  contents: read

concurrency:
  group: android-deep-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 37 and NDK
        shell: bash
        run: |
          android sdk install platforms/android-37 build-tools/36.0.0 ndk/28.2.13676358
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run deep-link JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
