name: Gemini Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for Gemini"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          prompt: ${{ inputs.prompt }}
