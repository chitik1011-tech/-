[package]
name = "tg-mobile-telegram"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.88"

[dependencies]
grammers-client = "=0.12.0"
grammers-mtproto = "=0.12.0"
grammers-session = { version = "=0.12.0", features = ["sqlite-storage"] }
tg-mobile-core = { path = "../core" }
tg-media-cache = { path = "../media-cache" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
